<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Демо: Переводы с ошибками</title>
    <link rel="stylesheet" href="styles.css">
		<script>
				(function(r){
					window.r46=window.r46||function(){(window.r46.q=window.r46.q||[]).push(arguments)};
					var c="https://cdn.rees46.ru",v="/v3.js",s={link:[{href:c,rel:"dns-prefetch"},{href:c,rel:"preconnect"},{href:c+v,rel:"preload",as:"script"}],script:[{src:c+v,async:""}]};
					Object.keys(s).forEach(function(c){s[c].forEach(function(d){var e=document.createElement(c),a;for(a in d)e.setAttribute(a,d[a]);document.head.appendChild(e)})});
				})();
				// Инициализация
				r46('init', '0f34e10ddff84d4acc3a6add28c74d');
				// Передача контакнтых данных
				r46('profile', 'set', {
					"email": "kechinoff@gmail.com",
					"phone": "+79500099233"
				});
				// Подписка на веб пуши с проверкой
				r46('subscription', 'web_push_supported', function(e) {
					if( e ) {
						r46('subscription', 'web_push_subscribed', function(e) {
							const getCookie = name => Object.assign({}, ...document.cookie.split(';').filter(s => s).map(cookie => cookie.split('=')).map(([key, value]) => ({ [key.trim()]: (value+'').trim() })))[name];
							if( !e && localStorage.getItem('web_push_subscribe') !== getCookie('rees46_session_code') ) {
								r46('subscription', 'web_push_subscribe');
								localStorage.setItem('web_push_subscribe', getCookie('rees46_session_code'));
							}
						});
					}
				});
		</script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Система переводов</h1>
            
            <div class="toggle-section">
                <label class="toggle-label">
                    <span class="toggle-text">Ошибки переводов:</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="errorToggle" checked>
                        <span class="slider"></span>
                    </div>
                    <span class="toggle-status" id="toggleStatus">Работают</span>
                </label>
            </div>

            <form id="transferForm" class="transfer-form">
                <div class="form-group">
                    <label for="recipient">Получатель:</label>
                    <select id="recipient" name="recipient" required>
                        <option value="">Выберите получателя</option>
                        <option value="user1">Иван Иванов</option>
                        <option value="user2">Мария Петрова</option>
                        <option value="user3">Алексей Сидоров</option>
                        <option value="user4">Елена Козлова</option>
                        <option value="user5">Дмитрий Волков</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Сумма перевода (₽):</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="Введите сумму" required>
                </div>

                <button type="submit" class="submit-btn">Выполнить перевод</button>
            </form>

            <div id="message" class="message"></div>
        </div>

        <div class="info-card">
            <h3>Информация для разработчиков</h3>
            <p>Коды ошибок возвращаются в консоли браузера и в заголовках ответа.</p>
            <div id="errorCode" class="error-code-display"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
